<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tutor3D demo</title>
    <style>body { margin: 24px; background: #0b1120; }</style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import "/web/src/vendor/three.iife.js";
      import "/web/src/anim/tutorAnim.js";
      import "/web/src/anim/tutor3d.js";

      const s = createScene3D({ span: 6 });
      s.grid();
      s.axes();
      // Helix: circular motion in the x/y plane advancing along z
      const helix = s.curve3d(
        (t) => [Math.cos(t * 4 * Math.PI), Math.sin(t * 4 * Math.PI), t * 10 - 5],
        { color: "#38bdf8", progress: 0 }
      );
      const dot = s.sphere({ r: 0.15, color: "#f59e0b" });
      s.tween(helix, { progress: [0, 1] }, 6, { easing: "linear" });
      s.tween(dot.position, {
        x: (t) => Math.cos(t * 4 * Math.PI),
        y: (t) => Math.sin(t * 4 * Math.PI),
        z: (t) => t * 10 - 5,
      }, 6, { easing: "linear" });
      s.label("circular motion over time = a wave", { x: 0, y: 2.2, z: 0, size: 0.8 });
    </script>
  </body>
</html>
